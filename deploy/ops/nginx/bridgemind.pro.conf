server {
    listen 80;
    listen [::]:80;
    server_name bridgemind.pro www.bridgemind.pro;

    return 301 https://bridgemind.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bridgemind.pro;

    ssl_certificate /etc/letsencrypt/live/bridgemind.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridgemind.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bridgemind.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bridgemind.pro;

    server_tokens off;
    client_max_body_size 256m;

    # HSTS kept intentionally narrow: enable HTTPS memory without forcing all future subdomains.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    ssl_certificate /etc/letsencrypt/live/bridgemind.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridgemind.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
